<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.6" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="12 12" stroke-opacity="0.4" />

  <!-- Crown Emblem -->
  <g filter="url(#shadow)" transform="translate(0, -20)">
    <!-- Crown Base -->
    <path d="M128 320 L160 180 L224 250 L256 140 L288 250 L352 180 L384 320 Z" fill="url(#gold)" stroke="#fef08a" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Crown Band -->
    <path d="M120 320 Q256 350 392 320 L388 350 Q256 380 124 350 Z" fill="#b45309" stroke="#f59e0b" stroke-width="4" />
    
    <!-- Crown Jewels -->
    <circle cx="160" cy="180" r="14" fill="#ef4444" stroke="#fef08a" stroke-width="3" />
    <circle cx="256" cy="140" r="18" fill="#38bdf8" stroke="#fef08a" stroke-width="4" />
    <circle cx="352" cy="180" r="14" fill="#10b981" stroke="#fef08a" stroke-width="3" />
    
    <!-- Central Diamond -->
    <polygon points="256,220 270,240 256,260 242,240" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Title Text: REI RUN -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="52" fill="url(#glow)" text-anchor="middle" letter-spacing="4">
    REI RUN
  </text>
  
  <!-- Subtitle Text: O ZERO -->
  <text x="256" y="456" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="20" fill="#a1a1aa" text-anchor="middle" letter-spacing="3">
    HAMILTON · O ZERO
  </text>
</svg>
